[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "payproof"
version = "0.2.0"
description = "Private payment-evidence workflow with synthetic fixtures and a prepared PayPal sandbox adapter"
requires-python = ">=3.11"
dependencies = ["cryptography==50.0.2"]

[tool.setuptools]
packages = ["payproof", "tools"]

[tool.setuptools.package-data]
payproof = ["web/*.html", "web/*.js", "web/*.css", "web/recorded-run117.json", "web/recorded-run117.review.json", "local_ai_training91.json", "inactive_integration71.json"]
tools = ["offline_report/*.py", "offline_report/*.json"]
