name: PayProof bounded Netcup151 Sandbox
on:
  workflow_dispatch:
    inputs:
      expected_head:
        type: string
        required: true
      source_admission_reference:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: payproof-selfhosted10-once
  cancel-in-progress: false
jobs:
  sandbox-chain:
    if: ${{ false }} # Sole admitted run41437718344 consumed; no replay
    environment: payproof-sandbox-readonly
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # One admitted job, independent receiver maximum600s
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Native source preflight without PayPal or bridge secrets
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          ADMISSION: ${{ inputs.source_admission_reference }}
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_HEAD"
          test "$GITHUB_REPOSITORY_ID" = '1419908202'
          test "$GITHUB_ACTOR_ID" = '273768139'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$ADMISSION" = 'OWNER_NETCUP_PAYPROOF151_20261102'
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
          cache: ''
      - name: Pinned existing cryptography dependencies outside critical600s
        run: |
          python -m venv "$RUNNER_TEMP/payproof10-venv"
          "$RUNNER_TEMP/payproof10-venv/bin/python" -c 'import subprocess,sys; subprocess.run([sys.executable,"-m","pip","install","--disable-pip-version-check","--no-cache-dir","--only-binary=:all:","--require-hashes","-r","deploy10/requirements.lock"],timeout=480,check=True)' 
      - name: Await actual Master CAS witness, no PayPal credentials released
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/payproof10-venv/bin/python" -B -m tools.sandbox_worker10 preflight --root .
      - name: Exact run-bound private bridge and one Sandbox chain
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAYPROOF_NETCUP_BRIDGE_TOKEN: ${{ secrets.PAYPROOF_NETCUP_BRIDGE_TOKEN }}
          PAYPROOF_PAYPAL_SANDBOX_CLIENT_ID: ${{ secrets.PAYPROOF_PAYPAL_SANDBOX_CLIENT_ID }}
          PAYPROOF_PAYPAL_SANDBOX_CLIENT_SECRET: ${{ secrets.PAYPROOF_PAYPAL_SANDBOX_CLIENT_SECRET }}
        run: |
          "$RUNNER_TEMP/payproof10-venv/bin/python" -B -m tools.sandbox_worker10 execute --root .
      # No logs/artifacts/cache/raw/approvalURL upload; cleanup native resources
      # remains the sole Master's exact-ID provider operation after receipt.
